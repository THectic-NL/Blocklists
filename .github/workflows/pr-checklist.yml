name: PR checklist

# Vinkt de twee punten af die uit de pull request zelf af te leiden zijn, en
# ruimt de niet-aangevinkte regels onder "Type wijziging" op. De rest van de
# checklist blijft handwerk: of iemand de pagina echt in de browser heeft
# bekeken, valt hier niet te controleren.
#
# Zephyrus-Linux heeft een eigen, uitgebreidere versie van deze job in
# pr-checks.yml die daarnaast nog EN/NL-pariteit, AVIF en de linkcheck afvinkt.
# Die blijft daar staan; deze workflow draait daar niet.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  update-checklist:
    name: Update PR checklist
    runs-on: ubuntu-latest
    # pull-requests: write om de omschrijving te herschrijven.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            let body = pr.body || '';
            if (!body.trim()) return;

            const setCheck = (keyword, passed) => {
              body = body.replace(
                new RegExp(`- \\[[ xX]\\] (.*${keyword}.*)`, 'i'),
                `- [${passed ? 'x' : ' '}] $1`
              );
            };

            // Dezelfde typelijst als pr-title.yml en CONTRIBUTING.md. Scope en
            // een `!` voor een breaking change zijn toegestaan: feat(nav)!: ...
            const TITLE_RE =
              /^(feat|fix|content|docs|chore|refactor|style|revert)(\([^)]+\))?!?: .+/;
            setCheck('PR-titel volgt', TITLE_RE.test(pr.title));

            // De niet-gekozen types weghalen, maar alleen als er al een gekozen
            // is. Zonder die voorwaarde stript de eerste run alle acht regels
            // weg voordat de auteur er een heeft aangevinkt, en is de sectie
            // weg voordat hij gebruikt kon worden.
            const TYPE_LINE = /^- \[([ xX])\] `\w+` —[^\n]*\n?/gm;
            const ticked = [...body.matchAll(TYPE_LINE)]
              .some(m => m[1].toLowerCase() === 'x');
            if (ticked) {
              body = body.replace(/^- \[ \] `\w+` —[^\n]*\n?/gm, '');
            }

            body = body.replace(/\n{3,}/g, '\n\n');

            if (body !== pr.body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body,
              });
            }
